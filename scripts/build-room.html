<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Room</title>
<style>
  :root{--bg:#f2f3f5;--card:#fff;--ink:#14181c;--ink-2:#626c75;--ink-3:#949ea6;
    --rule:#dfe3e7;--accent:#ee6216;--ok:#2c6e49;--bad:#b03027;--solid:#e3e8ec;--field:#fff;}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1e21;--card:#23272b;--ink:#e6eaed;
    --ink-2:#98a2aa;--ink-3:#6d777e;--rule:#32383d;--accent:#ff7a33;--ok:#63b98a;
    --bad:#e8705f;--solid:#2c3237;--field:#191c1f;}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;
    font-size:13px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;user-select:none}
  .mono,.lab,.arch,.tag,td,th{font-family:Consolas,ui-monospace,monospace}

  header{flex:0 0 auto;padding:14px 18px 12px;border-bottom:1px solid var(--rule)}
  header b{font-size:15px;font-weight:650}
  header span{color:var(--ink-3);margin-left:8px;font-size:12px}

  main{flex:1 1 auto;display:grid;grid-template-columns:1fr;overflow:hidden}
  @media (min-width:720px){main{grid-template-columns:1fr 320px}}
  .plan{padding:12px;overflow:auto;background:var(--bg);border-right:1px solid var(--rule);
    display:grid;place-items:center}
  .plan svg{width:100%;height:auto;max-height:100%}
  .side{overflow-y:auto;padding:14px 16px;display:grid;align-content:start;gap:14px}

  .lab{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
    display:block;margin-bottom:5px}
  table{width:100%;border-collapse:collapse}
  td{padding:2px 0}
  select,input{padding:4px 6px;background:var(--field);color:var(--ink);border:1px solid var(--rule);
    border-radius:4px;font:inherit;font-size:12.5px;font-family:Consolas,monospace;outline:none;width:100%}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=number]{font-variant-numeric:tabular-nums}
  .arch{font-size:11px;color:var(--ink-3);white-space:nowrap;text-align:right;padding-left:6px}
  .x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:15px;
    width:20px;padding:0;border-radius:3px}
  .x:hover{color:var(--bad)}
  .add{padding:4px 9px;border-radius:4px;cursor:pointer;background:transparent;
    border:1px dashed var(--rule);color:var(--ink-2);font:inherit;font-size:11.5px;width:100%}
  .add:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .cl{border:1px solid var(--rule);border-radius:5px;padding:10px 12px;background:var(--card)}
  .cl .tag{font-size:9.5px;letter-spacing:.11em;padding:1px 7px;border-radius:2px;color:#fff}
  .cl.good{border-color:var(--ok)} .cl.good .tag{background:var(--ok)}
  .cl.bad{border-color:var(--bad)} .cl.bad .tag{background:var(--bad)}
  .cl p{margin:7px 0 0;font-size:11.5px;color:var(--ink-2)}

  footer{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:11px 18px;
    border-top:1px solid var(--rule)}
  button.go{padding:7px 16px;border-radius:5px;border:0;cursor:pointer;font:inherit;
    font-size:13px;font-weight:600;background:var(--accent);color:#fff;margin-left:auto}
  button.go:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{padding:7px 13px;border-radius:5px;cursor:pointer;background:transparent;
    border:1px solid var(--rule);color:var(--ink-2);font:inherit;font-size:12.5px}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:11px;color:var(--ink-3)}
</style>
</head>
<body>

<header><b>Build Room</b><span>runs in inches, read straight off the plan</span></header>

<main>
  <div class="plan"><svg id="sv" viewBox="-80 -80 400 320"></svg></div>
  <div class="side">
    <div>
      <span class="lab">Room name</span>
      <input id="nm" type="text" value="Room" spellcheck="false">
    </div>
    <div>
      <span class="lab">Wall runs</span>
      <table><tbody id="runs"></tbody></table>
      <button class="add" id="addrun">+ run</button>
    </div>
    <div>
      <span class="lab">Doors — run #, from that run's start corner</span>
      <table><tbody id="doors"></tbody></table>
      <button class="add" id="adddoor">+ door</button>
    </div>
    <div class="two">
      <div><span class="lab">Wall thick</span><input id="thick" type="number" value="4" step="0.5"></div>
      <div><span class="lab">Ceiling</span><input id="ceil" type="number" value="96" step="1"></div>
    </div>
    <div class="cl" id="cl"></div>
  </div>
</main>

<footer>
  <span class="hint" id="hint"></span>
  <button class="ghost" id="cancel">Cancel</button>
  <button class="go" id="go">Build room</button>
</footer>

<script>
(function(){
  "use strict";
  var DIRS=["E","S","W","N"];
  var VEC={E:[1,0],S:[0,1],W:[-1,0],N:[0,-1]};   // screen y is down
  var runs=[{d:"E",v:216},{d:"S",v:96},{d:"W",v:84},{d:"S",v:60},{d:"W",v:132},{d:"N",v:156}];
  var doors=[{run:0,at:60,w:36,hinge:"near"}];

  var $sv=document.getElementById("sv"), $runs=document.getElementById("runs"),
      $doors=document.getElementById("doors"), $cl=document.getElementById("cl"),
      $go=document.getElementById("go"), $hint=document.getElementById("hint");

  function arch(n){
    var neg=n<0; n=Math.abs(n);
    var f=Math.floor(n/12), i=Math.round((n-f*12)*10)/10;
    if(i>=12){f+=1;i-=12;}
    return (neg?"-":"")+f+"'-"+(i%1===0?i:i.toFixed(1))+'"';
  }
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function el(t,a,x){var e=document.createElementNS("http://www.w3.org/2000/svg",t);
    for(var k in a)e.setAttribute(k,a[k]); if(x!=null)e.textContent=x; return e;}

  function pts(){
    var p=[[0,0]],x=0,y=0;
    runs.forEach(function(r){var v=VEC[r.d]||[0,0];x+=v[0]*r.v;y+=v[1]*r.v;p.push([x,y]);});
    return p;
  }

  function draw(){
    var p=pts(), last=p[p.length-1];
    var closed=Math.abs(last[0])<0.02&&Math.abs(last[1])<0.02;
    var xs=p.map(function(q){return q[0];}),ys=p.map(function(q){return q[1];});
    var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
    var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
    var cx=(x0+x1)/2,cy=(y0+y1)/2,m=Math.max(60,(x1-x0)*0.22);
    $sv.setAttribute("viewBox",(x0-m)+" "+(y0-m)+" "+(x1-x0+2*m)+" "+(y1-y0+2*m));
    while($sv.firstChild)$sv.removeChild($sv.firstChild);

    var d=p.map(function(q,i){return (i?"L":"M")+q[0]+","+q[1];}).join(" ");
    $sv.appendChild(el("path",{d:d+(closed?" Z":""),
      fill:closed?"var(--solid)":"none",
      stroke:closed?"var(--ink)":"var(--bad)","stroke-width":Math.max(1.5,(x1-x0)/220),
      "stroke-linejoin":"round","stroke-dasharray":closed?"none":"8 6"}));
    if(!closed){
      $sv.appendChild(el("path",{d:"M"+last[0]+","+last[1]+" L0,0",stroke:"var(--bad)",
        "stroke-width":Math.max(1,(x1-x0)/300),"stroke-dasharray":"4 4",fill:"none"}));
    }

    var off=Math.max(16,(x1-x0)*0.055), fs=Math.max(7,(x1-x0)/38);
    runs.forEach(function(r,i){
      if(r.v<=0)return;
      var a=p[i],b=p[i+1],v=VEC[r.d]||[0,0];
      var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      var nx=-v[1],ny=v[0];
      if((mx-cx)*nx+(my-cy)*ny<0){nx=-nx;ny=-ny;}
      $sv.appendChild(el("path",{d:"M"+(a[0]+nx*off)+","+(a[1]+ny*off)+
        " L"+(b[0]+nx*off)+","+(b[1]+ny*off),stroke:"var(--accent)",
        "stroke-width":Math.max(.8,(x1-x0)/400),fill:"none"}));
      var tx=mx+nx*(off+fs*.9),ty=my+ny*(off+fs*.9)+fs*.35;
      var t=el("text",{x:tx,y:ty,"text-anchor":"middle",fill:"var(--accent)",
        "font-size":fs,"font-family":"Consolas, monospace"},arch(r.v));
      if(Math.abs(v[1])>0)t.setAttribute("transform","rotate(-90 "+tx+" "+ty+")");
      $sv.appendChild(t);
      var lb=el("text",{x:mx,y:my+fs*.35,"text-anchor":"middle",fill:"var(--ink-3)",
        "font-size":fs*.85,"font-family":"Consolas, monospace"},String(i));
      $sv.appendChild(lb);
    });

    // doors, drawn as a gap marker on their run
    doors.forEach(function(dr){
      var i=dr.run|0; if(i<0||i>=runs.length)return;
      var a=p[i],b=p[i+1],v=VEC[runs[i].d]||[0,0];
      var j0=[a[0]+v[0]*dr.at,a[1]+v[1]*dr.at];
      var j1=[a[0]+v[0]*(dr.at+dr.w),a[1]+v[1]*(dr.at+dr.w)];
      $sv.appendChild(el("path",{d:"M"+j0[0]+","+j0[1]+" L"+j1[0]+","+j1[1],
        stroke:"var(--accent)","stroke-width":Math.max(3,(x1-x0)/90),
        "stroke-linecap":"butt",fill:"none",opacity:".85"}));
    });

    var sumH=0,sumV=0;
    runs.forEach(function(r){var v=VEC[r.d]||[0,0];sumH+=v[0]*r.v;sumV+=v[1]*r.v;});
    $cl.className="cl "+(closed?"good":"bad");
    $cl.innerHTML='<span class="tag">'+(closed?"CHAIN CLOSES":"DOES NOT CLOSE")+"</span>"+
      (closed
        ? "<p>Overall "+arch(x1-x0)+" &times; "+arch(y1-y0)+". Every chain agrees with its overall.</p>"
        : "<p>Out by "+arch(Math.abs(sumH))+" east&ndash;west and "+arch(Math.abs(sumV))+
          " north&ndash;south. A chain that doesn't close means a wall face was misread &mdash; " +
          "fix the take-off before building.</p>");
    $go.disabled=!closed;
    $hint.textContent=closed?(runs.length+" runs, "+doors.length+" door(s)"):"fix the closure to build";
  }

  function runRows(){
    $runs.innerHTML="";
    runs.forEach(function(r,i){
      var tr=document.createElement("tr");
      tr.innerHTML='<td style="width:22px"><span class="arch" style="text-align:left">'+i+'</span></td>'+
        '<td style="width:58px"><select data-i="'+i+'" data-k="d">'+
          DIRS.map(function(d){return '<option'+(d===r.d?" selected":"")+'>'+d+"</option>";}).join("")+
        "</select></td>"+
        '<td><input type="number" step="1" min="0" data-i="'+i+'" data-k="v" value="'+r.v+'"></td>'+
        '<td class="arch">'+esc(arch(r.v))+"</td>"+
        '<td style="width:22px"><button class="x" data-del="'+i+'">&times;</button></td>';
      $runs.appendChild(tr);
    });
    bind($runs,runs,runRows);
  }

  function doorRows(){
    $doors.innerHTML="";
    doors.forEach(function(d,i){
      var tr=document.createElement("tr");
      tr.innerHTML='<td style="width:52px"><input type="number" min="0" data-i="'+i+'" data-k="run" data-t="d" value="'+d.run+'" title="run #"></td>'+
        '<td><input type="number" min="0" data-i="'+i+'" data-k="at" data-t="d" value="'+d.at+'" title="from corner"></td>'+
        '<td><input type="number" min="1" data-i="'+i+'" data-k="w" data-t="d" value="'+d.w+'" title="width"></td>'+
        '<td style="width:62px"><select data-i="'+i+'" data-k="hinge" data-t="d">'+
          ['near','far'].map(function(h){return '<option'+(h===d.hinge?" selected":"")+'>'+h+"</option>";}).join("")+
        "</select></td>"+
        '<td style="width:22px"><button class="x" data-deld="'+i+'">&times;</button></td>';
      $doors.appendChild(tr);
    });
    bind($doors,doors,doorRows);
  }

  function bind(root,arr,redraw){
    Array.prototype.forEach.call(root.querySelectorAll("input,select"),function(f){
      f.addEventListener(f.tagName==="SELECT"?"change":"input",function(){
        var i=+f.dataset.i,k=f.dataset.k;
        arr[i][k]=(f.type==="number")?(parseFloat(f.value)||0):f.value;
        if(k==="v"){ f.closest("tr").querySelector(".arch").textContent=arch(arr[i][k]); }
        draw();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-del]"),function(b){
      b.addEventListener("click",function(){runs.splice(+b.dataset.del,1);runRows();draw();});
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-deld]"),function(b){
      b.addEventListener("click",function(){doors.splice(+b.dataset.deld,1);doorRows();draw();});
    });
  }

  document.getElementById("addrun").addEventListener("click",function(){
    runs.push({d:"E",v:48});runRows();draw();});
  document.getElementById("adddoor").addEventListener("click",function(){
    doors.push({run:0,at:36,w:36,hinge:"near"});doorRows();draw();});
  document.getElementById("cancel").addEventListener("click",function(){sketchup.cancel();});
  document.getElementById("go").addEventListener("click",function(){
    // SketchUp's y is up; the editor's is down. Flip N/S on the way out so the
    // room is built the way it was drawn.
    var out=runs.map(function(r){
      return {d:(r.d==="N"?"S":(r.d==="S"?"N":r.d)),v:r.v};
    });
    sketchup.build(JSON.stringify({
      name:document.getElementById("nm").value,
      runs:out, doors:doors,
      thick:parseFloat(document.getElementById("thick").value)||4,
      ceil:parseFloat(document.getElementById("ceil").value)||96,
      door_h:80
    }));
  });

  runRows();doorRows();draw();
}());
</script>
</body>
</html>
