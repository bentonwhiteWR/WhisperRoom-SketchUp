<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grammar parity — parseLen vs takeoff-vectors.json</title>
<!--
  The JS half of the grammar-parity check (AC-4). The Python half is
  `python scripts/takeoff-check.py - -selftest` (no space). This page fetches
  scripts/build-room.html, extracts the REAL parseLen by text (so it can never
  drift from the shipped dialog), fetches scripts/takeoff-vectors.json, and
  runs every vector. Browsers block fetch() over file://, so serve the folder:

      cd scripts && python -m http.server 8000
      start http://localhost:8000/takeoff-vectors.html
-->
<style>
  body{font-family:Consolas,ui-monospace,monospace;font-size:13px;margin:20px;
    background:#f2f3f5;color:#14181c}
  .pass{color:#2c6e49}.fail{color:#b03027;font-weight:700}
  td{padding:2px 10px 2px 0}
</style>
</head>
<body>
<h3>parseLen grammar parity</h3>
<div id="out">loading…</div>
<script>
(async function(){
  var out=document.getElementById("out");
  try{
    var html=await (await fetch("build-room.html")).text();
    var m=html.match(/function parseLen\(s\)\{[\s\S]*?\n  \}/);
    if(!m) throw new Error("could not find parseLen in build-room.html");
    var parseLen=new Function("return ("+m[0].replace(/^function parseLen/,"function")+")")();
    var vecs=(await (await fetch("takeoff-vectors.json")).json()).vectors;
    var rows=[],fails=0;
    vecs.forEach(function(v){
      var got=parseLen(v.s);
      var ok=(v.in===null)?isNaN(got):(Math.abs(got-v.in)<1e-9);
      if(!ok)fails++;
      rows.push('<tr><td class="'+(ok?"pass":"fail")+'">'+(ok?"PASS":"FAIL")+
        '</td><td>'+JSON.stringify(v.s)+'</td><td>want '+v.in+'</td><td>got '+got+'</td></tr>');
    });
    out.innerHTML='<p class="'+(fails?"fail":"pass")+'">'+vecs.length+
      ' vectors, '+fails+' failed — parseLen extracted live from build-room.html</p>'+
      '<table>'+rows.join("")+'</table>';
  }catch(e){
    out.innerHTML='<p class="fail">'+e+'</p><p>fetch() is blocked over file:// — '+
      'serve this folder first: <b>python -m http.server 8000</b> in scripts/, '+
      'then open http://localhost:8000/takeoff-vectors.html</p>';
  }
}());
</script>
</body>
</html>
