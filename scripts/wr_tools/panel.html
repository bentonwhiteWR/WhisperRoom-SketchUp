<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhisperRoom</title>
<style>
  /* One surface, one search, no tabs. The old panel split abilities and
     scripts across two tabs with search on only one of them, stacked four
     header bands, and made every script a fat card. This one is a single
     scrolling list under a single command bar that filters everything —
     and understands a pasted booth-builder link. */

  :root {
    --bg:      #f4f5f6;
    --surface: #ffffff;
    --ink:     #1c2327;
    --muted:   #66727a;
    --faint:   #9aa4ab;
    --line:    #e2e6e9;
    --accent:  #ee6216;
    --accent-soft: #fdeee4;
    --on:      #1d8a4b;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #c9d0d5; border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
        stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ------------------------------------------------------------ top bar -- */

  .top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
  }
  .brand {
    font-weight: 650;
    font-size: 13.5px;
    letter-spacing: .01em;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand::before {
    content: "";
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }
  .iconbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .iconbtn:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* -------------------------------------------------------- command bar -- */

  .cmd {
    margin: 0 12px 8px;
    position: relative;
  }
  .cmd input {
    width: 100%;
    padding: 8px 30px 8px 32px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .cmd input:focus { border-color: var(--accent); }
  .cmd .lens {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--faint);
    pointer-events: none;
  }
  .cmd .clear {
    position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    display: none;
    align-items: center; justify-content: center;
    border: 0; border-radius: 5px;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    font-size: 14px;
  }
  .cmd .clear:hover { color: var(--ink); background: var(--bg); }

  /* A pasted booth-builder link turns the command bar into an action. */
  .linkgo {
    display: none;
    margin: 0 12px 8px;
    padding: 10px 12px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-soft);
    cursor: pointer;
    align-items: center;
    gap: 10px;
  }
  .linkgo .t  { font-weight: 600; }
  .linkgo .s  { color: var(--muted); font-size: 12px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .linkgo svg { color: var(--accent); flex: 0 0 auto; }
  .linkgo:hover { background: #fbe2d1; }

  /* ------------------------------------------------------ toolbar slots -- */

  /* The eight buttons on SketchUp's own toolbar, mirrored here so the row you
     click to customise looks like the row you are customising. */
  .slots {
    display: flex;
    gap: 5px;
    align-items: center;
    margin: 0 12px 6px;
    flex: 0 0 auto;
  }
  .slots .lbl {
    font-size: 10.5px; font-weight: 650; letter-spacing: .11em;
    color: var(--faint); margin-right: 3px;
  }
  .slot {
    position: relative;
    width: 32px; height: 32px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--faint);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .slot img { width: 19px; height: 19px; }
  .slot .num { font-size: 11px; }
  .slot.set { border-color: #d5dbdf; }
  .slot:hover { border-color: var(--accent); background: var(--accent-soft); }
  .slot .cnr {
    position: absolute; top: 1px; right: 3px;
    font-size: 8px; line-height: 1; color: var(--faint);
  }

  /* ---------------------------------------------------------- slot editor -- */

  .ovl {
    position: absolute; inset: 0;
    background: rgba(28, 35, 39, .38);
    display: none;
    align-items: center; justify-content: center;
    padding: 12px;
    z-index: 30;
  }
  .ovl.on { display: flex; }
  .card {
    display: flex; flex-direction: column;
    width: 100%; max-height: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
    overflow: hidden;
  }
  .card h3 {
    font-size: 13px; font-weight: 650;
    padding: 11px 13px;
    border-bottom: 1px solid var(--line);
  }
  .card .bd { padding: 11px 13px 13px; overflow-y: auto; }
  .card .ft {
    display: flex; gap: 7px;
    padding: 10px 13px;
    border-top: 1px solid var(--line);
    background: #fafbfb;
  }
  .card .ft .sp { margin-left: auto; }
  .card .fld {
    font-size: 10.5px; font-weight: 650; letter-spacing: .1em;
    color: var(--faint);
    margin: 10px 0 5px;
  }
  .card .fld:first-child { margin-top: 0; }
  .card select {
    width: 100%; font: inherit;
    padding: 6px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }
  .card select:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 9px; }

  .icons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 5px;
  }
  .ic {
    height: 38px; padding: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .ic img { width: 20px; height: 20px; }
  .ic .num { font-size: 11px; color: var(--faint); }
  .ic:hover { border-color: var(--accent); }
  .ic.on { border-color: var(--accent); background: var(--accent-soft); }

  .btn {
    font: inherit; font-size: 12.5px;
    padding: 6px 13px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #d9570f; }

  /* --------------------------------------------------------- favourites -- */

  .favs {
    display: flex;
    gap: 6px;
    align-items: center;
    margin: 0 12px 8px;
    overflow-x: auto;
    overflow-y: visible;
    flex: 0 0 auto;        /* the flex column must never squeeze this row */
    min-height: 32px;
    padding: 2px 0 4px;
  }
  .favs:empty { display: none; }
  .fav {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px 5px 8px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: var(--surface);
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .fav svg { width: 11px; height: 11px; fill: var(--accent); stroke: none; }
  .fav img { width: 14px; height: 14px; flex: 0 0 auto; }
  .fav:hover { border-color: var(--accent); }

  /* --------------------------------------------------------------- list -- */

  .scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 12px 12px;
  }

  .sect {
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: .12em;
    color: var(--faint);
    margin: 14px 2px 6px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .sect .n { font-weight: 400; letter-spacing: 0; }

  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    cursor: pointer;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row:hover, .row.sel { background: #f8f4f1; }

  .row .body   { flex: 1 1 auto; min-width: 0; }
  .row .title  { font-weight: 550; }
  .row .blurb  {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .meta {
    color: var(--faint);
    font-size: 11px;
    white-space: nowrap;
    text-align: right;
    flex: 0 0 auto;
  }
  .row .meta .file { display: block; }
  mark { background: #ffe3a8; color: inherit; border-radius: 2px; }

  .tag {
    font-size: 9.5px;
    font-weight: 650;
    letter-spacing: .07em;
    color: var(--accent);
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 0 4px;
    flex: 0 0 auto;
  }

  .star {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    opacity: 0;
    flex: 0 0 auto;
  }
  .row:hover .star, .star.on { opacity: 1; }
  .star svg { width: 13px; height: 13px; }
  .star.on  { color: var(--accent); }
  .star.on svg { fill: currentColor; }
  .star:hover { background: var(--bg); color: var(--accent); }

  /* ---------------------------------------------------------- abilities -- */

  .sw {
    position: relative;
    width: 32px; height: 18px;
    border: 0;
    border-radius: 9px;
    background: #ccd3d8;
    cursor: pointer;
    flex: 0 0 auto;
    transition: background .12s;
  }
  .sw i {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: left .12s;
  }
  .sw[aria-checked="true"] { background: var(--on); }
  .sw[aria-checked="true"] i { left: 16px; }

  .gear { composes: none; }
  .settings {
    padding: 4px 10px 10px 51px;
    display: grid;
    gap: 6px;
    border-top: 1px dashed var(--line);
    background: #fbfcfc;
  }
  .settings label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .settings label span { flex: 0 0 auto; min-width: 90px; }
  .settings input, .settings select {
    flex: 1 1 auto;
    font: inherit;
    padding: 3px 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--surface);
    color: var(--ink);
  }
  .settings input:focus, .settings select:focus { outline: none; border-color: var(--accent); }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 26px 12px;
  }
  .empty code {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--faint);
    word-break: break-all;
  }

  /* --------------------------------------------------------------- note -- */

  .note {
    display: none;
    margin: 0 12px 10px;
    padding: 7px 11px;
    border-radius: 7px;
    background: #eef6ef;
    border: 1px solid #cfe6d4;
    color: #22572f;
    font-size: 12px;
  }
  .note.bad { background: #fbeeec; border-color: #efd2cc; color: #93382a; }
</style>
</head>
<body>

  <div class="top">
    <span class="brand">WhisperRoom</span>
    <button class="iconbtn" id="rescan" title="Rescan the scripts folder">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="folder" title="Open the scripts folder">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="iconbtn" id="console" title="Ruby Console">
      <svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg>
    </button>
  </div>

  <div class="cmd">
    <svg class="lens" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" placeholder="Search — or paste a booth-builder link" autofocus
           autocomplete="off" spellcheck="false">
    <button class="clear" id="clear" title="Clear">&#10005;</button>
  </div>

  <div class="linkgo" id="linkgo">
    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    <div style="min-width:0">
      <div class="t">Build this booth design</div>
      <div class="s" id="linktext"></div>
    </div>
  </div>

  <div class="slots" id="slots"></div>
  <div class="favs" id="favs"></div>
  <div class="note" id="note"></div>
  <div class="scroll" id="scroll"></div>

  <div class="ovl" id="ovl">
    <div class="card">
      <h3 id="edtitle">Toolbar slot</h3>
      <div class="bd">
        <div class="fld">RUNS THIS SCRIPT</div>
        <select id="edscript"></select>
        <div class="fld">WEARS THIS ICON</div>
        <div class="icons" id="edicons"></div>
        <div class="hint">
          The button runs the new script straight away. A new <b>icon</b> is uploaded
          to SketchUp&rsquo;s toolbar when the command is created, so it appears the
          next time SketchUp starts.
        </div>
      </div>
      <div class="ft">
        <button class="btn" id="edclear">Clear slot</button>
        <button class="btn sp" id="edcancel">Cancel</button>
        <button class="btn primary" id="edsave">Save</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var DATA = { dir: "", scripts: [], abilities: [], recent: [], pinned: [],
               slots: [], slot_icons: [], icons: [], pin_n: 8 };

  // Category order, shared by the script list and the slot editor's dropdown so
  // the two never disagree about where a script lives.
  var ORDER = ["Build a booth", "Export art", "Model tools", "Room tools"];
  var MORE  = "More scripts";
  var view = [];              // filtered scripts, for keyboard navigation
  var sel = -1;
  var open = {};              // ability id -> settings expanded

  var $q      = document.getElementById("q");
  var $clear  = document.getElementById("clear");
  var $scroll = document.getElementById("scroll");
  var $favs   = document.getElementById("favs");
  var $note   = document.getElementById("note");
  var $linkgo = document.getElementById("linkgo");
  var $linktext = document.getElementById("linktext");
  var noteTimer = null;

  var STAR = '<svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.2L8 11.5 ' +
             '4.2 13.5l.7-4.2-3.1-3 4.3-.6z" stroke-linejoin="round"/></svg>';
  var GEAR = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/>' +
             '<path d="M8 1.4v1.8M8 12.8v1.8M14.6 8h-1.8M3.2 8H1.4' +
             'M12.7 3.3l-1.3 1.3M4.6 11.4l-1.3 1.3M12.7 12.7l-1.3-1.3M4.6 4.6L3.3 3.3"/></svg>';

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function hl(text, term) {
    var safe = esc(text);
    if (!term) return safe;
    var i = safe.toLowerCase().indexOf(esc(term).toLowerCase());
    if (i < 0) return safe;
    var n = esc(term).length;
    return safe.slice(0, i) + "<mark>" + safe.slice(i, i + n) + "</mark>" + safe.slice(i + n);
  }

  function byName(name) {
    return DATA.scripts.filter(function (s) { return s.name === name; })[0];
  }
  function isPinned(name) { return (DATA.pinned || []).indexOf(name) >= 0; }

  // A pasted booth-builder link is a command, not a search term.
  function boothLink(t) {
    return /booth-builder\?d=[A-Za-z0-9_-]+|#d=[A-Za-z0-9_-]{20,}/.test(t) ? t : null;
  }

  function note(msg, bad) {
    if (!msg) { $note.style.display = "none"; return; }
    $note.textContent = msg;
    $note.className = "note" + (bad ? " bad" : "");
    $note.style.display = "block";
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { $note.style.display = "none"; }, 6000);
  }

  // ------------------------------------------------------- toolbar slots --
  //
  // A mirror of SketchUp's own toolbar row: same count, same order, same
  // faces. Clicking a tile opens the editor for that slot. Two fields, script
  // and icon, saved together — see set_slot in main.rb for why.

  var $slots = document.getElementById("slots");
  var $ovl   = document.getElementById("ovl");
  var editing = -1;
  var editIcon = "";

  function slotAt(i)     { return (DATA.slots || [])[i] || "-"; }
  function slotIconAt(i) { return (DATA.slot_icons || [])[i] || "-"; }
  function filled(v)     { return v && v !== "-"; }

  function iconImg(id, cls) {
    return '<img class="' + (cls || "") + '" src="ico-' + esc(id) + '.svg" alt="">';
  }

  function drawSlots() {
    var n = DATA.pin_n || 8;
    var h = '<span class="lbl">TOOLBAR</span>';
    for (var i = 0; i < n; i++) {
      var name = slotAt(i), ic = slotIconAt(i), s = filled(name) ? byName(name) : null;
      var face = filled(ic) ? iconImg(ic) : '<span class="num">' + (i + 1) + "</span>";
      var tip = s ? s.title + " — click to change"
                  : "Slot " + (i + 1) + " is empty — click to assign a script and an icon";
      h += '<button class="slot' + (s ? " set" : "") + '" data-s="' + i +
           '" title="' + esc(tip) + '">' + face +
           (s ? '<span class="cnr">' + (i + 1) + "</span>" : "") + "</button>";
    }
    $slots.innerHTML = h;
    Array.prototype.forEach.call($slots.querySelectorAll(".slot"), function (el) {
      el.addEventListener("click", function () { openEditor(+el.dataset.s); });
    });
  }

  function openEditor(i) {
    editing = i;
    editIcon = filled(slotIconAt(i)) ? slotIconAt(i) : "";
    document.getElementById("edtitle").textContent = "Toolbar slot " + (i + 1);

    // Scripts offered in the panel's own category order, so the dropdown reads
    // the same way the list below it does.
    var cur = slotAt(i);
    var opts = '<option value="">&mdash; empty &mdash;</option>';
    var groups = {}, order = [];
    (DATA.scripts || []).forEach(function (s) {
      var c = s.cat || "More scripts";
      if (!groups[c]) { groups[c] = []; order.push(c); }
      groups[c].push(s);
    });
    order.sort(function (a, b) {
      var A = ORDER.indexOf(a), B = ORDER.indexOf(b);
      if (a === MORE) return 1;
      if (b === MORE) return -1;
      if (A < 0 && B < 0) return a < b ? -1 : 1;
      if (A < 0) return 1;
      if (B < 0) return -1;
      return A - B;
    });
    order.forEach(function (c) {
      opts += '<optgroup label="' + esc(c) + '">';
      groups[c].forEach(function (s) {
        opts += '<option value="' + esc(s.name) + '"' +
                (s.name === cur ? " selected" : "") + ">" + esc(s.title) + "</option>";
      });
      opts += "</optgroup>";
    });
    document.getElementById("edscript").innerHTML = opts;

    drawIconGrid();
    $ovl.className = "ovl on";
  }

  function drawIconGrid() {
    var h = '<button class="ic' + (editIcon ? "" : " on") + '" data-ic="" ' +
            'title="Numbered — the default face"><span class="num">' +
            (editing + 1) + "</span></button>";
    (DATA.icons || []).forEach(function (ic) {
      h += '<button class="ic' + (ic.id === editIcon ? " on" : "") + '" data-ic="' +
           esc(ic.id) + '" title="' + esc(ic.label) + '">' + iconImg(ic.id) + "</button>";
    });
    var $g = document.getElementById("edicons");
    $g.innerHTML = h;
    Array.prototype.forEach.call($g.querySelectorAll(".ic"), function (el) {
      el.addEventListener("click", function () {
        editIcon = el.dataset.ic;
        drawIconGrid();
      });
    });
  }

  function closeEditor() { editing = -1; $ovl.className = "ovl"; }

  document.getElementById("edcancel").addEventListener("click", closeEditor);
  document.getElementById("edsave").addEventListener("click", function () {
    if (editing < 0) return;
    sketchup.setslot(String(editing), document.getElementById("edscript").value, editIcon);
    closeEditor();
  });
  document.getElementById("edclear").addEventListener("click", function () {
    if (editing < 0) return;
    sketchup.setslot(String(editing), "", "");
    closeEditor();
  });
  $ovl.addEventListener("click", function (e) { if (e.target === $ovl) closeEditor(); });

  // ---------------------------------------------------------- favourites --
  //
  // The same slots again, as named buttons you can read. The tile row above
  // shows what the toolbar LOOKS like; this row says what each one DOES, in the
  // same order and wearing the same icon, so the two teach each other.

  function drawFavs() {
    var n = DATA.pin_n || 8;
    var h = "";
    for (var i = 0; i < n; i++) {
      var name = slotAt(i);
      if (!filled(name)) continue;
      var s = byName(name);
      if (!s) continue;
      var ic = slotIconAt(i);
      h += '<button class="fav' + (filled(ic) ? " ic" : "") + '" data-n="' + esc(name) +
           '" title="Run ' + esc(name) + '">' +
           (filled(ic) ? iconImg(ic) : STAR) + esc(s.title) + "</button>";
    }
    $favs.innerHTML = h;
    Array.prototype.forEach.call($favs.querySelectorAll(".fav"), function (el) {
      el.addEventListener("click", function () {
        var s = byName(el.dataset.n);
        if (s) sketchup.run(s.file);
      });
    });
  }

  // ----------------------------------------------------------- abilities --

  function abilityRows(list, term) {
    return list.map(function (a) {
      var sets = a.settings || [];
      var fields = sets.map(function (s) {
        var v = (a.values || {})[s.key];
        var input;
        if (s.kind === "choice") {
          input = '<select data-id="' + esc(a.id) + '" data-k="' + esc(s.key) + '">' +
            (s.choices || []).map(function (c) {
              return '<option' + (c === v ? " selected" : "") + ">" + esc(c) + "</option>";
            }).join("") + "</select>";
        } else {
          input = '<input type="text" value="' + esc(v) + '" data-id="' + esc(a.id) +
                  '" data-k="' + esc(s.key) + '">';
        }
        return "<label><span>" + esc(s.label) + "</span>" + input + "</label>";
      }).join("");

      return '<div class="row" data-ab="' + esc(a.id) + '">' +
               '<button class="sw" role="switch" aria-checked="' + (a.on_now ? "true" : "false") +
                 '" data-id="' + esc(a.id) + '"><i></i></button>' +
               '<div class="body">' +
                 '<div class="title">' + hl(a.label, term) + "</div>" +
                 (a.blurb ? '<div class="blurb">' + hl(a.blurb, term) + "</div>" : "") +
               "</div>" +
               (sets.length ? '<button class="star on gear" style="opacity:1" data-g="' +
                              esc(a.id) + '" title="Settings">' + GEAR + "</button>" : "") +
             "</div>" +
             (open[a.id] && sets.length ? '<div class="settings">' + fields + "</div>" : "");
    }).join("");
  }

  // ------------------------------------------------------------- scripts --

  function scriptRow(s, i, term) {
    var p = isPinned(s.name);
    return '<div class="row' + (i === sel ? " sel" : "") + '" data-i="' + i + '">' +
             '<div class="body">' +
               '<div class="title">' + hl(s.title, term) +
                 (s.fresh ? ' <span class="tag">NEW</span>' : "") + "</div>" +
               (s.blurb ? '<div class="blurb">' + hl(s.blurb, term) + "</div>" : "") +
             "</div>" +
             '<div class="meta">' + esc(s.ago) +
               '<span class="file">' + hl(s.name, term) + "</span></div>" +
             '<button class="star' + (p ? " on" : "") + '" data-n="' + esc(s.name) +
               '" title="' + (p ? "Unpin" : "Pin to favourites") + '">' + STAR + "</button>" +
           "</div>";
  }

  // ----------------------------------------------------------------- draw --

  function draw() {
    var term = $q.value.trim();
    $clear.style.display = term ? "flex" : "none";

    var link = boothLink(term);
    $linkgo.style.display = link ? "flex" : "none";
    if (link) { $linktext.textContent = term; }

    var t = term.toLowerCase();
    var abs = (DATA.abilities || []).filter(function (a) {
      return !t || (a.label + " " + (a.blurb || "")).toLowerCase().indexOf(t) >= 0;
    });
    view = (DATA.scripts || []).filter(function (s) {
      return !t || (s.title + " " + s.name + " " + (s.blurb || "")).toLowerCase().indexOf(t) >= 0;
    });
    if (link) { abs = []; view = []; }
    if (sel >= view.length) sel = view.length - 1;

    var h = "";
    if (abs.length) {
      h += '<div class="sect">ABILITIES <span class="n">' +
           abs.filter(function (a) { return a.on_now; }).length + " on</span></div>" +
           '<div class="group">' + abilityRows(abs, term) + "</div>";
    }
    if (view.length) {
      // Scripts grouped by their "@cat" header. Known categories in a fixed
      // order; anything uncategorised — generated booths, one-off layouts —
      // sinks into MORE SCRIPTS at the bottom, where run-once scripts belong.
      var groups = {};
      view.forEach(function (s) {
        var c = s.cat || MORE;
        (groups[c] = groups[c] || []).push(s);
      });
      var names = Object.keys(groups).sort(function (a, b) {
        if (a === MORE) return 1;
        if (b === MORE) return -1;
        var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
        if (ia < 0 && ib < 0) return a < b ? -1 : 1;
        if (ia < 0) return 1;
        if (ib < 0) return -1;
        return ia - ib;
      });
      var flat = [];
      names.forEach(function (c) { groups[c].forEach(function (s) { flat.push(s); }); });
      view = flat;                       // keyboard order follows display order
      var idx = 0;
      names.forEach(function (c) {
        h += '<div class="sect">' + esc(c).toUpperCase() + ' <span class="n">' +
             groups[c].length + "</span></div>" +
             '<div class="group">' + groups[c].map(function (s) {
               return scriptRow(s, idx++, term);
             }).join("") + "</div>";
      });
    }
    if (!h && !link) {
      h = DATA.scripts.length
        ? '<div class="empty">Nothing matches &ldquo;' + esc(term) + "&rdquo;</div>"
        : '<div class="empty">No .rb files found in<code>' + esc(DATA.dir) + "</code></div>";
    }
    $scroll.innerHTML = h;
    wire(term);
  }

  function wire() {
    Array.prototype.forEach.call($scroll.querySelectorAll(".row[data-i]"), function (el) {
      el.addEventListener("click", function () { runAt(+el.dataset.i); });
    });
    Array.prototype.forEach.call($scroll.querySelectorAll(".star[data-n]"), function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        sketchup.pin(el.dataset.n);
      });
    });
    Array.prototype.forEach.call($scroll.querySelectorAll(".sw"), function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var on = el.getAttribute("aria-checked") !== "true";
        el.setAttribute("aria-checked", on ? "true" : "false");   // optimistic
        sketchup.ability(el.dataset.id, on ? "true" : "false");
      });
    });
    Array.prototype.forEach.call($scroll.querySelectorAll("[data-g]"), function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        open[el.dataset.g] = !open[el.dataset.g];
        draw();
      });
    });
    Array.prototype.forEach.call($scroll.querySelectorAll(".settings select, .settings input"),
      function (el) {
        el.addEventListener("change", function () {
          sketchup.setting(el.dataset.id, el.dataset.k, el.value);
        });
        el.addEventListener("click", function (e) { e.stopPropagation(); });
      });
  }

  function runAt(i) {
    var s = view[i];
    if (s) sketchup.run(s.file);
  }

  function move(d) {
    if (!view.length) return;
    sel = Math.min(view.length - 1, Math.max(0, (sel < 0 ? -d : sel) + d));
    draw();
    var el = $scroll.querySelector(".row.sel");
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  // ------------------------------------------------------------ commands --

  $q.addEventListener("input", function () { sel = -1; draw(); });
  $q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown")      { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp")   { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      var link = boothLink($q.value.trim());
      if (link) { buildLink(link); }
      else if (sel >= 0) { runAt(sel); }
      else if (view.length === 1) { runAt(0); }
    }
    else if (e.key === "Escape") { $q.value = ""; sel = -1; draw(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && editing >= 0) { e.preventDefault(); closeEditor(); }
  });
  $clear.addEventListener("click", function () { $q.value = ""; sel = -1; draw(); $q.focus(); });

  function buildLink(link) {
    if (window.sketchup && sketchup.buildlink) {
      sketchup.buildlink(link);
      $q.value = "";
      draw();
    }
  }
  $linkgo.addEventListener("click", function () { buildLink($q.value.trim()); });

  document.getElementById("rescan").addEventListener("click", function () { sketchup.rescan(); });
  document.getElementById("folder").addEventListener("click", function () { sketchup.folder(); });
  document.getElementById("console").addEventListener("click", function () { sketchup.console(); });

  // Ruby is the source of truth for every switch position; the optimistic flip
  // on click only makes the switch feel immediate, and this render corrects it.
  window.WR = {
    render: function (payload) {
      DATA = payload || DATA;
      drawSlots();
      drawFavs();
      draw();
      if (DATA.note) note(DATA.note, /fail|error|could not|no /i.test(DATA.note));
    }
  };

  window.addEventListener("load", function () {
    if (window.sketchup && sketchup.ready) sketchup.ready();
  });
}());
</script>
</body>
</html>
